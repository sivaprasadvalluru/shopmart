spring.application.name=shopmart-api-test

# In-memory H2 database in MySQL compatibility mode so the test suite never needs a
# real MySQL server.
spring.datasource.url=jdbc:h2:mem:shopmart_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Skip the MySQL-flavored data.sql seed script; tests seed their own data explicitly.
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

shopmart.jwt.secret=test-only-secret-key-for-junit-tests-do-not-use-in-production-1234567890
shopmart.jwt.expiration-ms=3600000
